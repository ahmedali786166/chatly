<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a884" />
    <title>Chatly — You're offline</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f0f2f5;
        color: #111b21;
      }
      .card { max-width: 360px; text-align: center; }
      .icon {
        width: 88px;
        height: 88px;
        margin: 0 auto 20px;
        border-radius: 22px;
        background: #00a884;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(0, 168, 132, 0.28);
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #667781; }
      button {
        border: 0;
        border-radius: 999px;
        background: #00a884;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 11px 22px;
        cursor: pointer;
      }
      button:hover { background: #008069; }
      @media (prefers-color-scheme: dark) {
        body { background: #0b141a; color: #e9edef; }
        p { color: #8696a0; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="46" height="46" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path d="M32 13c-10.5 0-19 7.6-19 17 0 5.2 2.7 9.8 7 12.9-.4 3-1.7 5.6-3.7 7.6 3.8.1 7.2-1 9.9-2.9 1.9.5 3.8.7 5.8.7 10.5 0 19-7.6 19-17S42.5 13 32 13z" fill="#fff"/>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Chatly needs an internet connection to load your chats. Check your connection and
        try again — your messages will sync when you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
